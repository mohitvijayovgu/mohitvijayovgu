<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes blink  { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes ping   { 0%{r:4;opacity:1} 100%{r:12;opacity:0} }
    @keyframes glow   { 0%,100%{opacity:.35} 50%{opacity:.8} }
    .f1{animation:fadeIn .6s .1s ease both}
    .f2{animation:fadeIn .6s .3s ease both}
    .f3{animation:fadeIn .6s .5s ease both}
    .f4{animation:fadeIn .6s .7s ease both}
    .f5{animation:fadeIn .6s .9s ease both}
    .cursor{animation:blink 1s infinite}
    .ping{animation:ping 1.8s ease-out infinite}
    .glow{animation:glow 2.5s ease-in-out infinite}
    text{font-family:'Courier New',monospace}
    .cm{fill:#8b949e} .kw{fill:#ff7b72} .fn{fill:#d2a8ff}
    .st{fill:#a5d6ff} .val{fill:#79c0ff} .op{fill:#ff7b72}
    .out{fill:#3fb950} .lbl{fill:#8b949e} .ttl{fill:#e6edf3}
  </style>
</defs>
<rect width="900" height="420" rx="12" fill="#0d1117"/>
<rect width="900" height="420" rx="12" fill="none" stroke="#6c63ff" stroke-width="1.2" class="glow"/>
